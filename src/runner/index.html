<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Pattern Fixer — Batch F1 Runner</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="runner-body">
    <main class="runner">
      <h1>Batch F1 Runner</h1>
      <p id="runner-build" class="runner-build"></p>
      <p class="runner-intro">
        Runs the identify step against every served fixture and scores each against its
        <code>ground-truth.json</code>. Serve the benchmark first
        (<code>python3 -m http.server 8000</code> in the benchmark repo). ~10–15 min for 50 fixtures.
      </p>

      <div class="runner-controls">
        <label for="base-url">Fixtures base URL</label>
        <input id="base-url" type="text" value="http://localhost:8000" spellcheck="false" />
        <button id="start-button" type="button">Run batch</button>
        <button id="stop-button" type="button" class="secondary-button" disabled>Stop</button>
        <button id="download-json-button" type="button" class="secondary-button" disabled>Download JSON</button>
        <button id="download-csv-button" type="button" class="secondary-button" disabled>Download CSV</button>
      </div>

      <p id="runner-status" class="runner-status"></p>
      <div id="runner-summary" class="runner-summary hidden"></div>
      <div id="runner-results"></div>
    </main>
    <script type="module" src="./runner.js"></script>
  </body>
</html>
